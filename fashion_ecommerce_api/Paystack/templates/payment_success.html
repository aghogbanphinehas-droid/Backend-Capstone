<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .message {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .details {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
        }
        .detail-label {
            font-weight: bold;
        }
        .button {
            background-color: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Payment Successful!</h1>
        <p class="message">Your payment has been processed successfully.</p>
        
        {% if data %}
        <div class="details">
            <div class="detail-row">
                <span class="detail-label">Reference:</span>
                <span>{{ data.reference }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount:</span>
                <span>₦{{ data.amount|floatformat:2 }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span>{{ data.status|title }}</span>
            </div>
            {% if data.paid_at %}
            <div class="detail-row">
                <span class="detail-label">Paid At:</span>
                <span>{{ data.paid_at }}</span>
            </div>
            {% endif %}
        </div>
        {% endif %}
        
        <a href="/" class="button">Continue Shopping</a>
    </div>
</body>
</html>
